name: CI Vowel Analysis Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build --no-cache -t vowel-frequency-analyzer:latest .

      - name: Run Docker Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -e GITHUB_USER="${{ github.actor }}" \
            vowel-frequency-analyzer:latest

      # Activity 3: Update README
      - name: Update README
        run: |
          echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md

      # Activity 4: Commit and Push Changes (Lab Standard)
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || git pull origin master --rebase || true
          git add .
          git commit -m "Workflow: Updated HTML and README for ${{ github.actor }} [skip ci]" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
