name: CI Vowel Analysis Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Build Docker Image
        run: |
          docker build -t vowel-frequency-analyzer:latest .

      - name: Run Docker Container
        run: |
          docker run --rm -e GITHUB_USER="${{ github.actor }}" vowel-frequency-analyzer:latest

      - name: Commit and Push README changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update vowel frequency analysis report" || echo "No changes to commit"
          git push
