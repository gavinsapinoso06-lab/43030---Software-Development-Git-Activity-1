name: CI Vowel Analysis Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker Image
        run: docker build --no-cache -t vowel-frequency-analyzer:latest .

      - name: Run Docker Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -e GITHUB_USER="${{ github.actor }}" \
            vowel-frequency-analyzer:latest

      - name: Update README
        run: |
          echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md

      - name: Commit and Push README changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch origin main
          git checkout main || git checkout -b main
          git add README.md index.html
          git pull origin main --rebase || true
          git commit -m "Workflow: Updated HTML and README for ${{ github.actor }} [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
