name: CI Vowel Analysis Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: ci-vowel-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker Image
        run: docker build --no-cache -t vowel-frequency-analyzer:latest .

      - name: Run Docker Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -e GITHUB_USER="${{ github.actor }}" \
            vowel-frequency-analyzer:latest

      # Activity 3: Update README
      - name: Update README
        run: |
          echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md

      # Activity 4: Commit and Push Changes securely
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Workflow: Updated HTML and README for ${{ github.actor }} [skip ci]"
          file_pattern: README.md index.html
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
