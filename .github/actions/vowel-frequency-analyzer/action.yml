name: 'Vowel Frequency Analyzer'
description: 'Custom GitHub Action to analyze vowel frequencies in a text file and update README.md via Docker'

inputs:
  file:
    description: 'Path to the target text file for analysis'
    required: true
    default: 'data.txt'

runs:
  using: 'docker'
  image: 'ghcr.io/gavinsapinoso06-lab/vowel-frequency-analyzer:latest'
  entrypoint: '.github/scripts/entrypoint.sh'
  env:
    FILE: ${{ inputs.file }}
