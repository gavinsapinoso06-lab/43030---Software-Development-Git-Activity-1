name: CI Vowel Analysis Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Build Docker Image
        run: docker build --no-cache -t vowel-frequency-analyzer:latest .

      - name: Run Docker Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -e GITHUB_USER="${{ github.actor }}" \
            vowel-frequency-analyzer:latest

      - name: Update index.html Based on Actor
        run: |
          if [ "${{ github.actor }}" == "gavinsapinoso06-lab" ]; then
            sed -i '/<\/body>/i <p>Updated by Team Leader (${{ github.actor }}) on '"$(date)"'</p>' index.html
          else
            sed -i '/<\/body>/i <p>Updated by Team Member (${{ github.actor }}) on '"$(date)"'</p>' index.html
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add README.md index.html
          git commit -m "docs: update vowel frequency analysis and index.html [skip ci]" || echo "No changes to commit"
          git push origin main
